<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>رقم المشتري</title>
<style>
:root{
  --bg:#f3f5f8; --card:#ffffff; --text:#14202b; --muted:#6b7785; --line:#e6eaef;
  --head1:#1d2f40; --head2:#0f1a24; --green:#0a8a46; --green2:#0fa958; --red:#ce1126; --gold:#f5b301;
  --chip:#ffffff; --shadow:0 6px 20px rgba(15,26,36,.10);
}
body.dark{
  --bg:#0c141c; --card:#15212c; --text:#eef2f6; --muted:#93a1b0; --line:#223241; --chip:#1b2a37; --shadow:0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:system-ui,"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;font-size:16px;overscroll-behavior:none}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font-family:inherit;font-size:16px;color:var(--text)}

/* ===== الهيدر ===== */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(160deg,var(--head1),var(--head2));color:#fff;padding:14px 14px 12px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.brand{display:flex;align-items:center;gap:11px}
.brand img{width:44px;height:44px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.brand .t{flex:1;min-width:0}
.brand h1{margin:0;font-size:20px;font-weight:800;letter-spacing:.2px}
.brand small{display:flex;align-items:center;gap:6px;opacity:.75;font-size:12px;margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;background:#999;display:inline-block}
.dot.on{background:#3ddc84;box-shadow:0 0 6px #3ddc84}.dot.off{background:#ff5a5a}
.ibtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.09);position:relative}
.ibtn:active{background:rgba(255,255,255,.2)}
.ibtn svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:6px;left:6px;width:10px;height:10px;border-radius:50%;background:var(--red);border:2px solid var(--head1);display:none}
.badge.show{display:block}
.spin svg{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(-360deg)}}

.search{margin-top:12px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border-radius:14px;padding:0 12px;height:44px}
.search svg{width:19px;height:19px;stroke:#cfd8e1;fill:none;stroke-width:2}
.search input{flex:1;background:none;border:0;outline:0;color:#fff;height:100%}
.search input::placeholder{color:#aebbc8}
.search .x{color:#cfd8e1;font-size:20px;display:none;padding:4px}

/* ===== شريط المثبتة ===== */
.pins{background:var(--card);border-bottom:1px solid var(--line);padding:10px 0 12px;display:none}
.pins.show{display:block}
.pins .ph{display:flex;align-items:center;gap:6px;padding:0 14px 8px;font-weight:700;font-size:14px;color:var(--muted)}
.pins .ph b{color:var(--text)}
.prow{display:flex;gap:10px;overflow-x:auto;padding:2px 14px 4px;scrollbar-width:none}
.prow::-webkit-scrollbar{display:none}
.pchip{flex:0 0 auto;display:flex;align-items:center;gap:9px;background:var(--chip);border:1.5px solid var(--gold);border-radius:16px;padding:7px 10px 7px 12px;min-width:120px;max-width:230px;box-shadow:var(--shadow);text-align:right}
.pchip .av{width:38px;height:38px;font-size:16px}
.pchip .n{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchip .r{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap}
.pchip .r.soon{color:var(--red);font-weight:700}
.pchip .call{margin-right:auto;width:34px;height:34px;border-radius:50%;background:var(--green);display:grid;place-items:center;flex:0 0 auto}
.pchip .call svg{width:17px;height:17px;fill:#fff}

/* ===== القائمة ===== */
.meta{display:flex;justify-content:space-between;padding:12px 16px 4px;font-size:13px;color:var(--muted)}
.list{padding-bottom:110px}
.lsec{position:relative;background:var(--bg);padding:8px 18px 4px;font-weight:800;color:var(--green);font-size:14px}
.row{display:flex;align-items:center;gap:13px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.row:active{background:var(--line)}
.row,.pchip{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.row.press{background:var(--line)}
/* شريط التنقل السريع */
.fs{position:fixed;left:4px;top:calc(var(--stick,120px) + 10px);bottom:96px;width:30px;z-index:25;display:none;opacity:0;pointer-events:none;transition:opacity .25s;background:var(--card);box-shadow:var(--shadow);flex-direction:column;justify-content:space-between;align-items:center;padding:6px 0;border-radius:15px;touch-action:none}
.fs.show{display:flex}
.fs.show.vis{opacity:1;pointer-events:auto}
.fs.act{background:var(--card)}
.fs span{font-size:11.5px;font-weight:800;color:var(--muted);line-height:1;padding:1px 0;flex:1;display:flex;align-items:center}
.fs span.on{color:var(--green)}
.fsb{position:fixed;left:50px;width:62px;height:62px;border-radius:50% 50% 50% 8px;background:var(--green);color:#fff;font-size:30px;font-weight:800;display:none;place-items:center;z-index:26;box-shadow:var(--shadow);transform:translateY(-50%)}
.fsb.show{display:grid}
/* قائمة الضغط المطول */
.qhead{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.qhead .av{width:50px;height:50px;font-size:21px}
.qhead .n{font-weight:800;font-size:18px}.qhead .p{color:var(--muted);direction:ltr;text-align:right;font-size:14px}
.qi{display:flex;align-items:center;gap:14px;width:100%;padding:14px 6px;border-bottom:1px solid var(--line);font-size:16px;font-weight:600;text-align:right}
.qi:last-child{border-bottom:0}.qi .e{font-size:20px;width:28px;text-align:center}
.qi.dng{color:var(--red)}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px;flex:0 0 auto}
.row .info{flex:1;min-width:0}
.row .n{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.row .p{color:var(--muted);font-size:14px;margin-top:3px;direction:ltr;text-align:right}
.row .note{color:var(--muted);font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinic{font-size:13px}
.qcall{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(10,138,70,.12)}
.qcall svg{width:20px;height:20px;fill:var(--green)}
.empty{text-align:center;color:var(--muted);padding:60px 20px;line-height:1.9}
.empty .big{font-size:48px}

.fab{position:fixed;left:18px;bottom:22px;z-index:30;width:58px;height:58px;justify-content:center;border-radius:50%;background:linear-gradient(135deg,var(--green2),var(--green));color:#fff;font-weight:800;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(10,138,70,.45)}
.fab svg{width:28px;height:28px;stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round}
.fab:active{transform:scale(.96)}

/* ===== النوافذ السفلية ===== */
.shade{position:fixed;inset:0;background:rgba(5,10,15,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.shade.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-radius:24px 24px 0 0;max-height:92vh;overflow-y:auto;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding:10px 18px 26px}
.sheet.show{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:4px 0 14px;font-size:19px}
.hero{text-align:center;padding:6px 0 4px}
.hero .av{width:84px;height:84px;font-size:34px;margin:0 auto 10px}
.hero .n{font-size:22px;font-weight:800}
.hero .p{font-size:18px;color:var(--muted);direction:ltr;margin-top:4px}
.hero .note{margin-top:8px;color:var(--muted);font-size:14px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0 6px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;padding:11px 4px;border-radius:16px;background:var(--bg);font-size:13px;font-weight:600}
.act .ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.act svg{width:20px;height:20px}
.box{background:var(--bg);border-radius:18px;padding:14px;margin-top:12px}
.box .bt{font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.durs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dur{padding:11px 4px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-weight:700;font-size:14px}
.dur:active,.dur.sel{border-color:var(--gold);background:rgba(245,179,1,.12)}
.custom{display:none;gap:8px;margin-top:10px;align-items:center}
.custom.show{display:flex}
.custom input{width:80px;text-align:center}
.pinned-info{line-height:1.8}
.pinned-info .big{font-size:20px;font-weight:800;color:var(--gold)}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.inp{width:100%;height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);padding:0 14px;outline:0}
textarea.inp{height:80px;padding:12px 14px;resize:none}
.inp:focus{border-color:var(--green)}
select.inp{appearance:none}
.btn{width:100%;height:50px;border-radius:15px;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:linear-gradient(135deg,var(--green2),var(--green));color:#fff}
.btn.sec{background:var(--bg);border:1.5px solid var(--line)}
.btn.dng{color:var(--red);background:rgba(206,17,38,.08)}
.btn.gold{background:var(--gold);color:#1b1b1b}
.btn+.btn{margin-top:9px}
.two{display:flex;gap:9px;margin-top:12px}.two .btn{margin:0}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.7}
.credit{text-align:center;margin-top:18px;font-size:14px;color:var(--muted)}
.credit a{color:var(--green);font-weight:800;text-decoration:none}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:6px 0 12px}
.sw{width:52px;height:30px;border-radius:16px;background:var(--line);position:relative;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.sw.on{background:var(--green)}.sw.on::after{right:25px}

.dlbar{height:14px;border-radius:8px;background:var(--bg);overflow:hidden;margin:6px 0 10px;border:1px solid var(--line)}
#dlFill{height:100%;width:0;background:linear-gradient(90deg,var(--green2),var(--green));border-radius:8px;transition:width .3s}
.dlrow{display:flex;justify-content:space-between;align-items:center;font-size:15px;margin-bottom:6px}
.dlrow b{font-size:22px;color:var(--green)}.dlrow span{color:var(--muted);direction:ltr}
.sug{margin-top:8px;border-radius:14px;overflow:hidden;border:1.5px solid var(--line);background:var(--card)}
.sug.dup{border-color:var(--red)}
.sug .sh{padding:8px 12px;font-size:13px;font-weight:800;color:var(--muted);background:var(--bg)}
.sug.dup .sh{color:#fff;background:var(--red)}
.sug .si{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;border-top:1px solid var(--line);text-align:right}
.sug .si .av{width:32px;height:32px;font-size:14px}
.sug .si .n{font-weight:700;font-size:14.5px}.sug .si .n mark{background:rgba(245,179,1,.35);color:inherit;border-radius:3px}
.sug .si .p{font-size:12.5px;color:var(--muted);direction:ltr;margin-right:auto}
.waitbtn{display:none;align-items:center;gap:12px;width:calc(100% - 28px);margin:12px 14px 0;padding:13px 14px;border-radius:16px;background:var(--card);border:1.5px solid var(--gold);box-shadow:var(--shadow);font-weight:800;font-size:16px;text-align:right}
.waitbtn.show{display:flex}.waitbtn:active{transform:scale(.98)}
.waitbtn .wi{font-size:20px}.waitbtn .wt{flex:1}
.waitbtn .wc{min-width:30px;height:30px;padding:0 9px;border-radius:15px;background:var(--gold);color:#1b1b1b;display:grid;place-items:center;font-size:15px}
.waitbtn .wa{color:var(--muted);font-size:22px}
.modebar{display:none;align-items:center;gap:10px;padding:12px 14px 4px;font-size:17px}
.modebar.show{display:flex}.modebar button{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:20px}
.modebar span{color:var(--muted);font-size:14px;margin-right:auto}
.wtitle{display:none;padding:14px 16px 6px;font-weight:800;color:var(--muted);font-size:14.5px}.wtitle.show{display:block}
.wlist{margin:0 -18px}.wlist .row:first-child{border-top:1px solid var(--line)}
.wlist .left{font-size:12px;color:var(--muted);margin-top:2px}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:#1d2b38;color:#fff;padding:11px 18px;border-radius:14px;font-size:14.5px;z-index:90;opacity:0;transition:.25s;pointer-events:none;max-width:88vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.upbar{display:none;margin:10px 14px 0;background:linear-gradient(135deg,#f5b301,#ffcf3f);color:#1b1b1b;border-radius:14px;padding:10px 12px;font-weight:700;align-items:center;gap:8px;font-size:14px}
.upbar.show{display:flex}
.upbar button{margin-right:auto;background:#1b1b1b;color:#fff;border-radius:10px;padding:7px 12px;font-weight:700;font-size:13px}
</style>
</head>
<body>

<header class="top" id="top">
  <div class="brand">
    <img src="logo.png" alt="">
    <div class="t">
      <h1>رقم المشتري</h1>
      <small><span class="dot" id="dot"></span><span id="sync">الساحة العراقية</span></small>
    </div>
    <button class="ibtn" id="btnUpd" title="تحديث الصفحة">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
    <button class="ibtn" id="btnSet" title="الإعدادات">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
  <div class="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="ابحث بالاسم أو الرقم" autocomplete="off">
    <button class="x" id="qx">×</button>
  </div>
</header>

<div class="upbar" id="upbar">⬆️ <span id="upText">اكو نسخة جديدة من التطبيق</span><button id="upGo">حدّث هسه</button></div>

<section class="pins" id="pins">
  <div class="ph">📌 <b>المثبتة</b> <span id="pinCount"></span></div>
  <div class="prow" id="prow"></div>
</section>
<button class="waitbtn" id="allBtn" style="border-color:var(--green)"><span class="wi">📇</span><span class="wt">جهات الاتصال</span><span class="wc" id="allCount" style="background:var(--green);color:#fff">0</span><span class="wa">‹</span></button>
<div class="modebar" id="modeBar"><button id="modeBack">→</button><b>📇 جهات الاتصال</b><span id="modeCount"></span></div>
<div class="wtitle" id="wTitle">📌 الأسماء في الانتظار <span id="wTitleN"></span></div>
<button class="waitbtn" id="waitBtn"><span class="wi">📌</span><span class="wt">الأسماء في الانتظار</span><span class="wc" id="waitCount">0</span><span class="wa">‹</span></button>

<div class="meta"><span id="count"></span><span id="last"></span></div>
<main class="list" id="list"></main>

<button class="fab" id="fab"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

<div class="fs" id="fs"></div><div class="fsb" id="fsb"></div>
<div class="shade" id="shade"></div>
<!-- الأسماء في الانتظار (المثبتة) -->
<div class="sheet" id="shWait"><div class="grab"></div><h3>📌 الأسماء في الانتظار</h3><div id="waitList" class="wlist"></div></div>
<!-- قائمة الضغط المطول -->
<div class="sheet" id="shQuick"><div class="grab"></div><div id="quickBody"></div></div>

<!-- تفاصيل الاسم -->
<div class="sheet" id="shView"><div class="grab"></div><div id="viewBody"></div></div>

<!-- إضافة / تعديل -->
<div class="sheet" id="shEdit"><div class="grab"></div>
  <h3 id="editTitle">إضافة اسم</h3>
  <button class="btn sec" id="pickC" style="margin-bottom:14px">📇 اختيار من جهات الاتصال</button>
  <div class="field"><label>الاسم</label><input class="inp" id="eName" placeholder="اسم المشتري" autocomplete="off"><div id="eSug"></div></div>
  <div class="field"><label>رقم الهاتف</label><input class="inp" id="ePhone" type="tel" dir="ltr" placeholder="07xx xxx xxxx"><div id="ePhWarn"></div></div>
  <div class="field"><label>ملاحظة (اختياري)</label><textarea class="inp" id="eNote"></textarea></div>
  <button class="btn pri" id="eSave">حفظ</button>
  <button class="btn sec" data-close>إلغاء</button>
</div>

<!-- الربط بالسيرفر: يطلع أول مرة فقط، أو اذا تغيّر العنوان/الرمز -->
<div class="sheet" id="shSetup"><div class="grab"></div>
  <h3>ربط التطبيق</h3>
  <div id="setupMsg" class="box" style="margin:0 0 14px"></div>
  <div class="field"><label>عنوان السيرفر</label><input class="inp" id="sUrl" dir="ltr" placeholder="https://raqam.sahaiq3.com/api.php"></div>
  <div class="field"><label>رمز المزامنة</label><input class="inp" id="sKey" type="password" dir="ltr"></div>
  <div class="field"><label>اسم هذا الجهاز</label><input class="inp" id="sDev"><div class="hint">يطلع بالتثبيت حتى تعرف منو ثبّت الاسم.</div></div>
  <button class="btn pri" id="sSave">ربط</button>
</div>

<!-- الإعدادات -->
<div class="sheet" id="shSet"><div class="grab"></div>
  <h3>الإعدادات</h3>
  <label class="toggle" id="darkRow"><span>🌙 الوضع الليلي</span><span class="sw" id="darkSw"></span></label>
  <div class="box">
    <div class="bt">⬆️ تحديث التطبيق</div>
    <div class="hint" id="verTxt"></div>
    <button class="btn gold" id="sUpd" style="margin-top:10px">فحص التحديث</button>
  </div>
  <div class="credit">تطوير: <a href="https://wa.me/9647703000874" id="credit">علي حميد</a></div>
</div>

<!-- تأكيد -->
<div class="sheet" id="shAsk"><div class="grab"></div>
  <h3 id="askT"></h3><div class="hint" id="askM" style="font-size:15px;margin-bottom:16px"></div>
  <div class="two"><button class="btn dng" id="askYes">نعم</button><button class="btn sec" data-close>لا</button></div>
</div>

<!-- تنزيل التحديث -->
<div class="sheet" id="shDl"><div class="grab"></div>
  <h3>⬇️ جاري تنزيل التحديث</h3>
  <div class="dlbar"><div id="dlFill"></div></div>
  <div class="dlrow"><b id="dlPct">0%</b><span id="dlMb"></span></div>
  <div class="hint" id="dlHint">لا تسد التطبيق لحد ما يكمل التنزيل.</div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const A=window.Android||null;           // جسر الأندرويد
const REPO='p2p37mx/raqam-almushtari';  // مكان النسخ الجديدة (GitHub Releases)
const DEF_URL='https://raqam.sahaiq3.com/api.php';
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

let cfg=LS.get('cfg',{url:DEF_URL,key:'',dev:'',dark:false});
// المعلومات مثبتة داخل التطبيق: الرمز من البناء، واسم الجهاز من الجوال نفسه
const BUILT_KEY=(()=>{try{return A&&A.appKey?A.appKey():''}catch(e){return ''}})();
if(!cfg.key&&BUILT_KEY)cfg.key=BUILT_KEY;
if(!cfg.dev){try{if(A&&A.deviceName)cfg.dev=A.deviceName()}catch(e){}}
if(!cfg.url)cfg.url=DEF_URL;
let data=LS.get('cache',{contacts:[],rev:0,now:0,at:0});
let offset=0;          // فرق ساعة السيرفر عن الجهاز
let online=null, busy=false, curId=null, editId=null, upd=null;

/* ===== أدوات ===== */
const nowS=()=>Math.floor(Date.now()/1000)+offset;
const ar2en=s=>String(s||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
const norm=s=>ar2en(s).toLowerCase().replace(/[ً-ْـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').trim();
const digits=s=>ar2en(s).replace(/\D+/g,'');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORS=['#0a8a46','#ce1126','#1f6feb','#8e44ad','#d35400','#16a085','#c0392b','#2c3e50','#b8860b','#e84393'];
const color=n=>{let h=0;for(const c of String(n))h=(h*31+c.charCodeAt(0))|0;return COLORS[Math.abs(h)%COLORS.length]};
const initial=n=>{const t=String(n||'?').trim();return t?t[0].toUpperCase():'?'};
const letter=n=>{let c=norm(n)[0]||'#';if(/[0-9]/.test(c))return '#';return c.toUpperCase()};
function fmtPhone(p){const d=digits(p);if(/^07\d{9}$/.test(d))return d.slice(0,4)+' '+d.slice(4,7)+' '+d.slice(7);return p||''}
function waNum(p){let d=digits(p);if(d.startsWith('00'))d=d.slice(2);else if(d.startsWith('0'))d='964'+d.slice(1);return d}
function left(sec){
  if(sec<=0)return 'انتهى';
  const d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60);
  if(d>0)return 'باقي '+d+' يوم'+(h?' و'+h+' س':'');
  if(h>0)return 'باقي '+h+' س'+(m?' و'+m+' د':'');
  if(m>0)return 'باقي '+m+' دقيقة';
  return 'باقي أقل من دقيقة';
}
function ago(t){if(!t)return '';const s=Math.floor(Date.now()/1000)-t;if(s<10)return 'هسه';if(s<60)return 'قبل '+s+' ثا';if(s<3600)return 'قبل '+Math.floor(s/60)+' د';return 'قبل '+Math.floor(s/3600)+' س'}
const isPinned=c=>c.pinned_until>nowS();
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600)}

const IC={
  call:'<svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>',
  wa:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.3 0 .5l-.3.5-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>'
};

/* ===== السيرفر ===== */
async function api(params,quiet){
  if(!cfg.key){needSetup('first');throw new Error('nokey')}
  const body=new URLSearchParams(Object.assign({key:cfg.key,by:cfg.dev||''},params));
  let r,j;
  try{
    const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),15000);
    r=await fetch(cfg.url||DEF_URL,{method:'POST',body,signal:ctl.signal,cache:'no-store'});clearTimeout(to);
    try{j=await r.json()}catch(e){setOnline(false);needSetup('bad');throw e}
  }catch(e){if(e.message!=='nokey'){setOnline(false);if(!quiet)toast('ماكو اتصال بالسيرفر — تأكد من الانترنت')}throw e}
  if(r.status===403){setOnline(false);needSetup('key');const e=new Error('key');e.j=j;throw e}
  setOnline(true);
  if(j.now)offset=j.now-Math.floor(Date.now()/1000);
  if(!j.ok){if(!quiet&&!j.dup)toast(j.err||'صار خطأ');const e=new Error(j.err);e.j=j;throw e}
  if(j.contacts){data={contacts:j.contacts,rev:j.rev,now:j.now,at:Math.floor(Date.now()/1000)};LS.set('cache',data);render()}
  else if(j.same){data.at=Math.floor(Date.now()/1000);LS.set('cache',data);showLast()}
  return j;
}
function setOnline(v){online=v;$('#dot').className='dot '+(v?'on':'off');showLast()}
function syncLbl(){const n=data.contacts.length;$('#sync').textContent=(online===false?'غير متزامن':(data.at?'متزامن':'الساحة العراقية'))+(n?' ( '+n+' اسم )':'')}
function showLast(){syncLbl()}
const PIN_STYLE='swap';   // 'swap' الواجهة = الانتظار وجهات الاتصال داخل زر / 'button' / 'chips'
let mode='wait';
function renderWait(pins){
  pins=pins||data.contacts.filter(isPinned).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  if(!pins.length){$('#waitList').innerHTML='<div class="empty">ماكو أسماء بالانتظار</div>';if(stack.includes('#shWait'))setTimeout(()=>{if(!data.contacts.some(isPinned)&&stack[stack.length-1]==='#shWait')close()},800);return}
  $('#waitList').innerHTML=pins.map(c=>`<div class="row" data-id="${c.id}">
      <div class="av" style="background:${color(c.name)}">${esc(initial(c.name))}</div>
      <div class="info"><div class="n">${esc(c.name)}</div>
        ${c.phone?`<div class="p">${esc(fmtPhone(c.phone))}</div>`:''}
        ${c.note?`<div class="note">${esc(c.note)}</div>`:''}</div>
      ${c.phone?`<button class="qcall" data-call="${c.id}">${IC.call}</button>`:''}
    </div>`).join('');
}
async function refresh(quiet){if(busy||!cfg.key)return;busy=true;try{await api({a:'list',rev:data.rev||0},true)}catch(e){}finally{busy=false}}

/* ===== العرض ===== */
function render(fromTimer){
  const q=norm($('#q').value);const qd=digits($('#q').value);
  $('#qx').style.display=$('#q').value?'block':'none';
  const all=data.contacts.slice().sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  const list=q?all.filter(c=>norm(c.name).includes(q)||(qd.length>=2&&digits(c.phone).includes(qd))||norm(c.note).includes(q))
    :(PIN_STYLE==='swap'&&mode==='wait'?all.filter(isPinned):all);
  const waitView=PIN_STYLE==='swap'&&mode==='wait'&&!q;

  // المثبتة — PIN_STYLE: 'button' زر «الأسماء في الانتظار» / 'chips' الشريط القديم
  const pins=all.filter(isPinned).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  $('#pins').classList.toggle('show',PIN_STYLE==='chips'&&pins.length>0);
  $('#waitBtn').classList.toggle('show',PIN_STYLE==='button'&&pins.length>0);
  const sw=PIN_STYLE==='swap';
  $('#allBtn').classList.toggle('show',sw&&mode==='wait'&&!q);$('#allCount').textContent=all.length;
  $('#modeBar').classList.toggle('show',sw&&mode==='all'&&!q);$('#modeCount').textContent=all.length+' اسم';
  $('#wTitle').classList.toggle('show',sw&&mode==='wait'&&!q&&pins.length>0);$('#wTitleN').textContent='('+pins.length+')';
  $('#waitCount').textContent=pins.length;
  renderWait(pins);
  syncLbl();
  $('#pinCount').textContent=pins.length?'('+pins.length+')':'';
  $('#prow').innerHTML=pins.map(c=>{const s=c.pinned_until-nowS();return `
    <div class="pchip" data-id="${c.id}">
      <div class="av" style="background:${color(c.name)}">${esc(initial(c.name))}</div>
      <div style="min-width:0"><div class="n">${esc(c.name)}</div></div>
      ${c.phone?`<button class="call" data-call="${c.id}">${IC.call}</button>`:''}
    </div>`}).join('');

  $('#count').textContent=q&&all.length?list.length+' نتيجة من '+all.length:'';
  $('.meta').style.display=q?'flex':'none';
  if(!all.length||!list.length)buildFS(false);
  if(!all.length){$('#list').innerHTML=`<div class="empty"><div class="big">📇</div>${cfg.key?'بعد ماكو أسماء.<br>اضغط زر + حتى تضيف أول مشتري':'اربط التطبيق بالسيرفر أول شي'}</div>`;return}
  if(!list.length&&waitView){$('#list').innerHTML=`<div class="empty"><div class="big">📌</div>ماكو أسماء بالانتظار.<br>افتح «جهات الاتصال» وثبّت أي اسم حتى يطلع هنا</div>`;return}
  if(!list.length){$('#list').innerHTML=`<div class="empty"><div class="big">🔍</div>ماكو نتيجة لـ «${esc($('#q').value)}»<br><button class="btn pri" style="margin-top:14px" id="addFromQ">إضافة «${esc($('#q').value)}»</button></div>`;return}
  let h='',L=null;
  for(const c of list){
    const l=letter(c.name);
    if(l!==L&&!q&&!waitView){h+=`<div class="lsec" data-l="${esc(l)}">${esc(l)}</div>`;L=l}
    h+=`<div class="row" data-id="${c.id}">
      <div class="av" style="background:${color(c.name)}">${esc(initial(c.name))}</div>
      <div class="info"><div class="n">${esc(c.name)}${isPinned(c)&&!waitView?'<span class="pinic">📌</span>':''}</div>
        ${c.phone?`<div class="p">${esc(fmtPhone(c.phone))}</div>`:''}
        ${c.note?`<div class="note">${esc(c.note)}</div>`:''}</div>
      ${c.phone?`<button class="qcall" data-call="${c.id}">${IC.call}</button>`:''}
    </div>`;
  }
  $('#list').innerHTML=h;
  fixStick();buildFS(!q&&list.length>12);
  if(!fromTimer&&curId&&$('#shView').classList.contains('show')&&!($('#custom')&&$('#custom').classList.contains('show')))renderView();
}
function fixStick(){const h=$('#top').offsetHeight;document.documentElement.style.setProperty('--stick',h+'px')}
const byId=id=>data.contacts.find(c=>c.id==id);

/* ===== النوافذ ===== */
let stack=[];
function zfix(){stack.forEach((x,i)=>{$(x).style.zIndex=50+i*2});$('#shade').style.zIndex=stack.length?49+(stack.length-1)*2:40}
function open(id){const el=$(id);stack=stack.filter(x=>x!==id);stack.push(id);zfix();el.classList.add('show');$('#shade').classList.add('show')}
function close(){const id=stack.pop();if(id)$(id).classList.remove('show');zfix();if(!stack.length)$('#shade').classList.remove('show');if(id==='#shView'||id==='#shQuick')curId=null;return !!id}
function closeAll(){while(stack.length)close()}
window.onBack=function(){if(stack.length){close();return true}if(mode==='all'&&!$('#q').value){setMode('wait');return true}if($('#q').value){$('#q').value='';render();return true}return false};

function renderView(){
  const c=byId(curId);if(!c){close();return}
  const p=isPinned(c);
  let pinHtml;
  if(p){
    pinHtml=`<div class="box"><div class="bt">📌 بالانتظار (مثبّت)</div>
      <div class="pinned-info"><div class="big">⏳ ${left(c.pinned_until-nowS())}</div>
      ${c.pinned_by?`<div class="hint">ثبّته: ${esc(c.pinned_by)}</div>`:''}
      <div class="hint">ينتهي: ${new Date((c.pinned_until-offset)*1000).toLocaleString('ar-IQ',{weekday:'long',hour:'numeric',minute:'2-digit',day:'numeric',month:'numeric'})}</div></div>
      <div class="two"><button class="btn dng" id="vUnpin">إلغاء التثبيت</button><button class="btn sec" id="vExt">تغيير المدة</button></div>
      <div id="durWrap" style="display:none;margin-top:12px">${durGrid()}</div></div>`;
  }else{
    pinHtml=`<div class="box"><div class="bt">📌 تثبيت بالانتظار — اختار المدة</div>${durGrid()}</div>`;
  }
  $('#viewBody').innerHTML=`
    <div class="hero"><div class="av" style="background:${color(c.name)}">${esc(initial(c.name))}</div>
      <div class="n">${esc(c.name)}</div>${c.phone?`<div class="p">${esc(fmtPhone(c.phone))}</div>`:''}
      ${c.note?`<div class="note">📝 ${esc(c.note)}</div>`:''}</div>
    <div class="acts">
      <button class="act" data-do="call"><span class="ic" style="background:var(--green)">${IC.call.replace('<svg','<svg fill="#fff"')}</span>اتصال</button>
      <button class="act" data-do="wa"><span class="ic" style="background:#25d366">${IC.wa}</span>واتساب</button>
      <button class="act" data-do="copy"><span class="ic" style="background:#1f6feb">${IC.copy}</span>نسخ</button>
      <button class="act" data-do="edit"><span class="ic" style="background:#6b7785">${IC.edit}</span>تعديل</button>
    </div>
    ${pinHtml}
    <button class="btn dng" id="vDel" style="margin-top:14px">🗑 حذف الاسم</button>
    ${c.added_by?`<div class="hint" style="text-align:center;margin-top:8px">أضافه: ${esc(c.added_by)}</div>`:''}`;
}
function durGrid(){
  const D=[[60,'ساعة'],[180,'3 ساعات'],[360,'6 ساعات'],[720,'12 ساعة'],[1440,'يوم'],[4320,'3 أيام'],[10080,'أسبوع'],[0,'مخصص']];
  return `<div class="durs">${D.map(d=>`<button class="dur" data-min="${d[0]}">${d[1]}</button>`).join('')}</div>
   <div class="custom" id="custom"><input class="inp" id="cNum" type="number" min="1" value="2" inputmode="numeric">
     <select class="inp" id="cUnit" style="flex:1"><option value="1">دقيقة</option><option value="60" selected>ساعة</option><option value="1440">يوم</option><option value="10080">أسبوع</option><option value="43200">شهر</option></select>
     <button class="btn gold" id="cGo" style="width:auto;padding:0 16px">ثبّت</button></div>`;
}
function openView(id){curId=id;renderView();open('#shView')}

/* ===== الضغط المطول ===== */
function openQuick(id){
  const c=byId(id);if(!c)return;curId=id;
  const p=isPinned(c);
  $('#quickBody').innerHTML=`
   <div class="qhead"><div class="av" style="background:${color(c.name)}">${esc(initial(c.name))}</div>
     <div><div class="n">${esc(c.name)}</div>${c.phone?`<div class="p">${esc(fmtPhone(c.phone))}</div>`:''}</div></div>
   <div id="qList">
     ${p?`<button class="qi" data-q="unpin"><span class="e">📌</span>إلغاء التثبيت <span class="hint" style="margin:0 auto 0 0">${left(c.pinned_until-nowS())}</span></button>`
        :`<button class="qi" data-q="pin"><span class="e">📌</span>تثبيت</button>`}
     ${p?`<button class="qi" data-q="pin"><span class="e">⏳</span>تغيير مدة التثبيت</button>`:''}
     ${c.phone?`<button class="qi" data-q="call"><span class="e">📞</span>اتصال</button>
     <button class="qi" data-q="wa"><span class="e">💬</span>واتساب</button>
     <button class="qi" data-q="copy"><span class="e">📋</span>نسخ الرقم</button>`:''}
     <button class="qi" data-q="edit"><span class="e">✏️</span>تعديل</button>
     <button class="qi dng" data-q="del"><span class="e">🗑</span>حذف</button>
   </div>
   <div id="qDur" style="display:none"><div class="bt" style="font-weight:800;margin-bottom:10px">📌 اختار مدة التثبيت</div>${durGrid()}</div>`;
  open('#shQuick');
  try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}
}
function delContact(c){ask('حذف «'+c.name+'»؟','راح ينحذف من كل الأجهزة.',()=>api({a:'delete',id:c.id}).then(()=>{toast('🗑 انحذف');closeAll()}).catch(()=>{}))}
function contactAct(d,c){
  if(d==='call')doCall(c);
  else if(d==='wa'){if(!c.phone)return toast('ماكو رقم');const u='https://wa.me/'+waNum(c.phone);if(A&&A.openUrl)A.openUrl(u);else window.open(u)}
  else if(d==='copy'){const s=c.phone||c.name;if(A&&A.copy)A.copy(s);else navigator.clipboard&&navigator.clipboard.writeText(s);toast('📋 انتسخ')}
  else if(d==='edit')openEdit(c.id);
}
(function(){
  let tm=null,sx=0,sy=0,el=null;
  const cancel=()=>{clearTimeout(tm);tm=null;if(el)el.classList.remove('press');el=null};
  document.addEventListener('touchstart',e=>{
    const r=e.target.closest('.row,.pchip');if(!r||e.target.closest('[data-call]'))return;
    el=r;sx=e.touches[0].clientX;sy=e.touches[0].clientY;
    tm=setTimeout(()=>{window._lp=Date.now();const id=+r.dataset.id;cancel();openQuick(id)},480);
  },{passive:true});
  document.addEventListener('touchmove',e=>{if(!tm)return;const t=e.touches[0];if(Math.abs(t.clientX-sx)>10||Math.abs(t.clientY-sy)>10)cancel()},{passive:true});
  document.addEventListener('touchend',cancel);document.addEventListener('touchcancel',cancel);
  document.addEventListener('contextmenu',e=>{if(e.target.closest('.row,.pchip'))e.preventDefault()});
})();

/* ===== شريط التنقل السريع ===== */
const FAST_SCROLL=false;   // شريط التنقل السريع — خليه true اذا تريد ترجعه
function buildFS(on){
  const fs=$('#fs');if(!FAST_SCROLL)on=false;
  if(!on){fs.classList.remove('show');return}
  const ls=[...document.querySelectorAll('.lsec')].map(x=>x.dataset.l);
  fs.innerHTML=ls.map(l=>`<span data-l="${esc(l)}">${esc(l)}</span>`).join('');
  fs.classList.add('show');
}
(function(){
  const fs=$('#fs'),bb=$('#fsb');let last=null;
  function at(y){
    const sp=[...fs.children];if(!sp.length)return;
    const r=fs.getBoundingClientRect();let i=Math.floor((y-r.top)/r.height*sp.length);
    i=Math.max(0,Math.min(sp.length-1,i));const l=sp[i].dataset.l;
    bb.textContent=l;bb.style.top=Math.max(r.top+30,Math.min(r.bottom-30,y))+'px';bb.classList.add('show');
    if(l===last)return;last=l;
    sp.forEach(x=>x.classList.toggle('on',x===sp[i]));
    const sec=document.querySelector('.lsec[data-l="'+CSS.escape(l)+'"]');
    const first=sec&&sec.nextElementSibling;if(!first)return;
    const y2=first.getBoundingClientRect().top+window.scrollY-$('#top').offsetHeight-sec.offsetHeight;
    window.scrollTo(0,Math.max(0,y2));
    try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}
  }
  let hideT,drag=false;
  const showFS=()=>{fs.classList.add('vis');clearTimeout(hideT);if(!drag)hideT=setTimeout(()=>fs.classList.remove('vis'),1500)};
  window.addEventListener('scroll',showFS,{passive:true});
  const end=()=>{drag=false;fs.classList.remove('act');bb.classList.remove('show');last=null;[...fs.children].forEach(x=>x.classList.remove('on'));showFS()};
  fs.addEventListener('touchstart',e=>{e.preventDefault();drag=true;clearTimeout(hideT);fs.classList.add('act','vis');at(e.touches[0].clientY)},{passive:false});
  fs.addEventListener('touchmove',e=>{e.preventDefault();at(e.touches[0].clientY)},{passive:false});
  fs.addEventListener('touchend',end);fs.addEventListener('touchcancel',end);
  fs.addEventListener('mousedown',e=>{at(e.clientY);const mv=ev=>at(ev.clientY),up=()=>{end();removeEventListener('mousemove',mv);removeEventListener('mouseup',up)};addEventListener('mousemove',mv);addEventListener('mouseup',up)});
})();

async function pin(min){
  const c=byId(curId);if(!c)return;
  try{await api({a:'pin',id:c.id,minutes:min});if(stack[stack.length-1]==='#shQuick')close();toast('📌 تثبّت «'+c.name+'» — '+left(min*60).replace('باقي ','لمدة '));}catch(e){}
}
function ask(t,m,yes){$('#askT').textContent=t;$('#askM').textContent=m;$('#askYes').onclick=()=>{close();yes()};open('#shAsk')}

/* ===== إضافة / تعديل ===== */
// ===== فحص الأسماء المتشابهة والمكررة أثناء الكتابة =====
const sameName=(a,b)=>norm(a).replace(/\s+/g,' ')===norm(b).replace(/\s+/g,' ');
function phoneKey(p){let d=digits(p);if(d.startsWith('00964'))d='0'+d.slice(5);else if(d.startsWith('964')&&d.length>11)d='0'+d.slice(3);return d}
function hl(name,q){const n=String(name);const i=norm(n).indexOf(q);if(!q||i<0)return esc(n);return esc(n.slice(0,i))+'<mark>'+esc(n.slice(i,i+q.length))+'</mark>'+esc(n.slice(i+q.length))}
function sugRow(c,q){return `<button class="si" data-open="${c.id}"><div class="av" style="background:${color(c.name)}">${esc(initial(c.name))}</div><span class="n">${hl(c.name,q)}</span>${c.phone?`<span class="p">${esc(fmtPhone(c.phone))}</span>`:''}</button>`}
function checkDup(){
  const raw=$('#eName').value.trim(),q=norm(raw).replace(/\s+/g,' ');
  const others=data.contacts.filter(c=>c.id!=editId);
  let h='';
  if(q.length>=2){
    const exact=others.filter(c=>sameName(c.name,raw));
    const toks=q.split(' ').filter(Boolean);
    const sim=others.filter(c=>!exact.includes(c)&&(()=>{const n=norm(c.name);return n.includes(q)||toks.every(t=>n.split(/\s+/).some(w=>w.startsWith(t)))})()).slice(0,5);
    if(exact.length)h+=`<div class="sug dup"><div class="sh">⚠️ هذا الاسم موجود</div>${exact.map(c=>sugRow(c,q)).join('')}</div>`;
    if(sim.length)h+=`<div class="sug"><div class="sh">أسماء متشابهة (${sim.length})</div>${sim.map(c=>sugRow(c,q)).join('')}</div>`;
  }
  $('#eSug').innerHTML=h;
  const pk=phoneKey($('#ePhone').value);let w='';
  if(pk.length>=7){const m=others.filter(c=>phoneKey(c.phone)===pk);if(m.length)w=`<div class="sug dup"><div class="sh">⚠️ هذا الرقم موجود</div>${m.map(c=>sugRow(c,'')).join('')}</div>`}
  $('#ePhWarn').innerHTML=w;
}
$('#eName').addEventListener('input',checkDup);$('#ePhone').addEventListener('input',checkDup);
function openEdit(id,pre){
  editId=id||null;const c=id?byId(id):null;
  $('#editTitle').textContent=c?'تعديل الاسم':'إضافة اسم';
  $('#eName').value=c?c.name:(pre&&pre.name||'');$('#ePhone').value=c?c.phone:(pre&&pre.phone||'');$('#eNote').value=c?c.note:'';
  checkDup();open('#shEdit');setTimeout(()=>{if(!c&&!$('#eName').value)$('#eName').focus()},300);
}
async function saveEdit(force,forceName){
  const name=$('#eName').value.trim(),phone=$('#ePhone').value.trim(),note=$('#eNote').value.trim();
  if(!name){toast('اكتب الاسم');$('#eName').focus();return}
  if(!forceName){const ex=data.contacts.find(c=>c.id!=editId&&sameName(c.name,name));
    if(ex){ask('الاسم موجود','«'+ex.name+'» موجود أصلاً'+(ex.phone?' برقم '+fmtPhone(ex.phone):'')+' — تريد تضيفه مرة ثانية؟',()=>saveEdit(force,true));return}}
  const btn=$('#eSave');btn.disabled=true;btn.textContent='جاري الحفظ...';
  try{
    if(editId){await api({a:'edit',id:editId,name,phone,note});toast('✅ تعدّل');close()}
    else{
      const j=await api({a:'add',name,phone,note,force:force?1:0});
      toast('✅ انضاف «'+name+'»');close();
    }
  }catch(e){
    if(e.j&&e.j.dup){ask('الرقم مكرر',e.j.err+' — تريد تضيفه هم؟',()=>saveEdit(true,true))}
  }finally{btn.disabled=false;btn.textContent='حفظ'}
}
window.onContactPicked=function(name,phone){
  if(name&&!$('#eName').value.trim())$('#eName').value=name; else if(name)$('#eName').value=name;
  if(phone)$('#ePhone').value=phone;
  checkDup();
};

/* ===== الإعدادات ===== */
const SETUP_MSG={first:'👋 هلا بيك! اكتب معلومات الربط مرة وحدة بس، وبعدها ما تطلع مرة ثانية.',
  key:'🔑 رمز المزامنة غلط أو تغيّر — اكتب الرمز الصحيح.',bad:'🌐 عنوان السيرفر تغيّر أو ما يشتغل — تأكد منه.',manual:'تعديل معلومات الربط.'};
function needSetup(why){
  if(stack.includes('#shSetup'))return;
  $('#setupMsg').textContent=SETUP_MSG[why]||SETUP_MSG.first;
  $('#sUrl').value=cfg.url||DEF_URL;$('#sKey').value=why==='key'?'':(cfg.key||'');$('#sDev').value=cfg.dev||'';
  closeAll();open('#shSetup');
}
function openSet(){
  $('#darkSw').classList.toggle('on',!!cfg.dark);
  $('#verTxt').textContent='النسخة الحالية: '+verName()+' (رقم '+verCode()+')';
  open('#shSet');
}
async function saveSet(){
  const url=$('#sUrl').value.trim()||DEF_URL,key=$('#sKey').value.trim(),dev=$('#sDev').value.trim();
  if(!key){toast('اكتب رمز المزامنة');return}
  const old=Object.assign({},cfg);
  cfg.url=url;cfg.key=key;cfg.dev=dev;data.rev=0;
  const btn=$('#sSave');btn.disabled=true;btn.textContent='جاري الربط...';
  stack=stack.filter(x=>x!=='#shSetup');   // حتى ما يرجع يفتح نفسه أثناء الفحص
  try{await api({a:'list',rev:0});LS.set('cfg',cfg);$('#shSetup').classList.remove('show');zfix();if(!stack.length)$('#shade').classList.remove('show');toast('✅ انربط التطبيق')}
  catch(e){if(e.message!=='key'&&!(e.j)){cfg=old;if(!stack.includes('#shSetup')){stack.push('#shSetup');zfix()}toast('ما كدر يوصل للسيرفر — تأكد من العنوان والانترنت')}}
  finally{btn.disabled=false;btn.textContent='ربط'}
}
function applyTheme(){document.body.classList.toggle('dark',!!cfg.dark);if(A&&A.setBars)try{A.setBars(cfg.dark?1:0)}catch(e){}}

/* ===== التحديث ===== */
const verCode=()=>{try{return A&&A.versionCode?parseInt(A.versionCode()):0}catch(e){return 0}};
const verName=()=>{try{return A&&A.versionName?A.versionName():'متصفح'}catch(e){return '?'}};
async function checkUpdate(manual){
  const b=$('#sUpd');if(manual){b.disabled=true;b.textContent='جاري الفحص...'}
  try{
    const r=await fetch('https://api.github.com/repos/'+REPO+'/releases/latest',{cache:'no-store'});
    if(!r.ok)throw new Error(r.status);
    const j=await r.json();
    const n=parseInt(String(j.tag_name||'').replace(/\D+/g,''))||0;
    const asset=(j.assets||[]).find(a=>/\.apk$/i.test(a.name));
    if(n>verCode()&&asset){
      upd={n,url:asset.browser_download_url,name:j.name||('نسخة '+n)};
      $('#upbar').classList.add('show');$('#upText').textContent='اكو نسخة جديدة ('+n+')';
      if(manual)doUpdate();
    }else{upd=null;$('#upbar').classList.remove('show');if(manual)toast('✅ عندك آخر نسخة ('+verCode()+')')}
  }catch(e){if(manual)toast('ما كدرت أفحص التحديث — تأكد من الانترنت')}
  finally{b.disabled=false;b.textContent='فحص التحديث'}
}
function doUpdate(){
  if(!upd)return checkUpdate(true);
  ask('تحديث التطبيق','راح ينزل '+upd.name+' ويطلب منك تثبيته. بياناتك محفوظة بالسيرفر وما تنمسح.',()=>{
    if(A&&A.downloadUpdate){A.downloadUpdate(upd.url)}else window.open(upd.url);
  });
}

/* ===== الأحداث ===== */
function doCall(c){if(!c||!c.phone)return toast('ماكو رقم');if(A&&A.call)A.call(c.phone);else location.href='tel:'+digits(c.phone)}
document.addEventListener('click',e=>{
  const t=e.target;
  const cl=t.closest('[data-call]');if(cl){e.stopPropagation();doCall(byId(cl.dataset.call));return}
  if(window._lp&&Date.now()-window._lp<700){e.preventDefault();return}
  const row=t.closest('.row,.pchip');if(row){openView(+row.dataset.id);return}
  const so=t.closest('[data-open]');
  if(so){const id=+so.dataset.open;close();setTimeout(()=>openView(id),150);return}
  const qi=t.closest('[data-q]');
  if(qi){const c=byId(curId);if(!c)return;const q=qi.dataset.q;
    if(q==='pin'){$('#qList').style.display='none';$('#qDur').style.display='block'}
    else if(q==='unpin')api({a:'unpin',id:c.id}).then(()=>{toast('انلغى التثبيت');close()}).catch(()=>{});
    else if(q==='del')delContact(c);
    else{close();contactAct(q,c)}
    return}
  if(t.closest('[data-close]')){close();return}
  const act=t.closest('[data-do]');
  if(act){const c=byId(curId);const d=act.dataset.do;
    if(d==='call')doCall(c);
    else if(d==='wa'){if(!c.phone)return toast('ماكو رقم');const u='https://wa.me/'+waNum(c.phone);if(A&&A.openUrl)A.openUrl(u);else window.open(u)}
    else if(d==='copy'){const s=c.phone||c.name;if(A&&A.copy)A.copy(s);else navigator.clipboard&&navigator.clipboard.writeText(s);toast('📋 انتسخ')}
    else if(d==='edit')openEdit(c.id);
    return}
  const dur=t.closest('.dur');
  if(dur){const m=+dur.dataset.min;if(m)pin(m);else{const box=dur.closest('.sheet');box.querySelectorAll('.dur').forEach(x=>x.classList.remove('sel'));dur.classList.add('sel');box.querySelector('.custom').classList.add('show')}return}
  if(t.id==='cGo'){const box=t.closest('.sheet');const m=Math.round((+box.querySelector('#cNum').value||0)*(+box.querySelector('#cUnit').value));if(m<1)return toast('اكتب المدة');pin(m);return}
  if(t.id==='vUnpin'){const c=byId(curId);api({a:'unpin',id:c.id}).then(()=>toast('انلغى التثبيت')).catch(()=>{});return}
  if(t.id==='vExt'){const w=$('#durWrap');w.style.display=w.style.display==='none'?'block':'none';return}
  if(t.id==='vDel'){const c=byId(curId);ask('حذف «'+c.name+'»؟','راح ينحذف من كل الأجهزة.',()=>api({a:'delete',id:c.id}).then(()=>{toast('🗑 انحذف');if(stack.includes('#shView')){stack=stack.filter(x=>x!=='#shView');$('#shView').classList.remove('show');curId=null;if(!stack.length)$('#shade').classList.remove('show')}}).catch(()=>{}));return}
  if(t.id==='addFromQ'){const v=$('#q').value.trim();openEdit(null,/^[\d\s+٠-٩]+$/.test(v)?{phone:v}:{name:v});return}
});
$('#shade').onclick=close;
$('#fab').onclick=()=>openEdit(null);
function setMode(m){mode=m;render();window.scrollTo(0,0)}
$('#allBtn').onclick=()=>setMode('all');$('#modeBack').onclick=()=>setMode('wait');
$('#waitBtn').onclick=()=>{renderWait();open('#shWait')};
$('#btnSet').onclick=()=>openSet();
// ضغطة مطولة على رقم النسخة = تعديل الربط يدوياً
(function(){let t;const v=$('#verTxt');v.addEventListener('touchstart',()=>{t=setTimeout(()=>needSetup('manual'),1200)});['touchend','touchmove'].forEach(e=>v.addEventListener(e,()=>clearTimeout(t)));v.addEventListener('dblclick',()=>needSetup('manual'))})();
$('#btnUpd').onclick=async()=>{   // تحديث الصفحة: يجيب آخر نسخة من الأسماء والتثبيتات
  const b=$('#btnUpd');if(b.classList.contains('spin'))return;b.classList.add('spin');
  busy=false;data.rev=0;
  try{await api({a:'list',rev:0});toast('✅ تحدّثت')}catch(e){}
  finally{setTimeout(()=>b.classList.remove('spin'),400)}
};
$('#upGo').onclick=doUpdate;$('#sUpd').onclick=()=>checkUpdate(true);
$('#sSave').onclick=saveSet;$('#eSave').onclick=()=>saveEdit(false);
$('#darkRow').onclick=e=>{e.preventDefault();cfg.dark=!cfg.dark;$('#darkSw').classList.toggle('on',cfg.dark);LS.set('cfg',cfg);applyTheme()};
$('#pickC').onclick=()=>{if(A&&A.pickContact)A.pickContact();else toast('هاي الميزة بالتطبيق فقط')};
$('#credit').onclick=e=>{if(A&&A.openUrl){e.preventDefault();A.openUrl('https://wa.me/9647703000874')}};
$('#q').oninput=render;$('#qx').onclick=()=>{$('#q').value='';render()};
window.addEventListener('resize',fixStick);

/* ===== التشغيل ===== */
applyTheme();render();showLast();
if(!cfg.key)setTimeout(()=>needSetup('first'),400);else refresh(true);
setInterval(()=>{if(!document.hidden)refresh(true)},6000);   // مزامنة كل 6 ثواني
setInterval(()=>{render(true)},20000);                           // تحديث العد التنازلي للتثبيت
document.addEventListener('visibilitychange',()=>{if(!document.hidden){refresh(true)}});
window.onResumeApp=()=>refresh(true);
// نسبة تنزيل التحديث (تجي من الأندرويد)
window.onUpdateProgress=function(done,total,state){
  if(!stack.includes('#shDl')){$('#dlFill').style.width='0';open('#shDl')}
  const mb=b=>(b/1048576).toFixed(1);
  const pct=total>0?Math.min(100,Math.floor(done*100/total)):0;
  $('#dlFill').style.width=pct+'%';$('#dlPct').textContent=total>0?pct+'%':'...';
  $('#dlMb').textContent=total>0?mb(done)+' / '+mb(total)+' MB':'';
  if(state==='ok'){$('#dlPct').textContent='100%';$('#dlFill').style.width='100%';$('#dlHint').textContent='✅ كمل التنزيل — اضغط «تثبيت» بالنافذة الي تطلع';setTimeout(()=>{if(stack.includes('#shDl')){stack=stack.filter(x=>x!=='#shDl');$('#shDl').classList.remove('show');zfix();if(!stack.length)$('#shade').classList.remove('show')}},2500)}
  else if(state==='fail'){$('#dlHint').textContent='❌ فشل التنزيل — تأكد من الانترنت وجرّب مرة ثانية'}
  else $('#dlHint').textContent='لا تسد التطبيق لحد ما يكمل التنزيل.';
};
setTimeout(()=>checkUpdate(false),2500);
})();
</script>
